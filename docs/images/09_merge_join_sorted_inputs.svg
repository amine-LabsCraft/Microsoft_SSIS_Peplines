<rect x="0.5" y="0.5" width="1199" height="499" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="52" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">Merge Join : pourquoi les entrées doivent être triées</text><text x="40" y="78" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start" xml:space="preserve">Une jointure par fusion compare deux flux ordonnés, sans charger toute une table en mémoire.</text>
<text x="40" y="120" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">Entrée gauche : Commande triée</text><g filter="url(#sh)"><clipPath id="t33"><rect x="40" y="130" width="160" height="198" rx="10"/></clipPath><g clip-path="url(#t33)"><rect x="40" y="130" width="160" height="198" fill="#fff"/><rect x="40" y="130" width="160" height="28" fill="#ede9fe"/><line x1="40" x2="200" y1="192" y2="192" stroke="#e2e8f0"/><line x1="40" x2="200" y1="226" y2="226" stroke="#e2e8f0"/><line x1="40" x2="200" y1="260" y2="260" stroke="#e2e8f0"/><line x1="40" x2="200" y1="294" y2="294" stroke="#e2e8f0"/></g><rect x="40" y="130" width="160" height="198" rx="10" fill="none" stroke="#cbd5e1"/></g><text x="50" y="149" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">ord_id</text><text x="50" y="179.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">1</text><text x="50" y="213.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">2</text><text x="50" y="247.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">3</text><text x="50" y="281.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">4</text><text x="50" y="315.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">5</text><text x="120" y="149" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">emp_id ↑</text><text x="120" y="179.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">E01</text><text x="120" y="213.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">E02</text><text x="120" y="247.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">E03</text><text x="120" y="281.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">E04</text><text x="120" y="315.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">E05</text><text x="460" y="120" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">Entrée droite : Vendeur trié</text><g filter="url(#sh)"><clipPath id="t34"><rect x="460" y="130" width="260" height="198" rx="10"/></clipPath><g clip-path="url(#t34)"><rect x="460" y="130" width="260" height="198" fill="#fff"/><rect x="460" y="130" width="260" height="28" fill="#ede9fe"/><line x1="460" x2="720" y1="192" y2="192" stroke="#e2e8f0"/><line x1="460" x2="720" y1="226" y2="226" stroke="#e2e8f0"/><line x1="460" x2="720" y1="260" y2="260" stroke="#e2e8f0"/><line x1="460" x2="720" y1="294" y2="294" stroke="#e2e8f0"/></g><rect x="460" y="130" width="260" height="198" rx="10" fill="none" stroke="#cbd5e1"/></g><text x="470" y="149" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">emp_id ↑</text><text x="470" y="179.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">E01</text><text x="470" y="213.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">E02</text><text x="470" y="247.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">E03</text><text x="470" y="281.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">E04</text><text x="470" y="315.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">E05</text><text x="560" y="149" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">emp_name</text><text x="560" y="179.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">Youssef Alami</text><text x="560" y="213.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">Salma Bennani</text><text x="560" y="247.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">Omar Idrissi</text><text x="560" y="281.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">Imane Alaoui</text><text x="560" y="315.5" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">Hamza El Amrani</text><path d="M200 175 C330 175, 330 175, 456 175" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#m-tf)"/><circle cx="328" cy="175" r="10" fill="#fff" stroke="#7c3aed"/><text x="328" y="179" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="middle" xml:space="preserve">=</text><path d="M200 209 C330 209, 330 209, 456 209" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#m-tf)"/><circle cx="328" cy="209" r="10" fill="#fff" stroke="#7c3aed"/><text x="328" y="213" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="middle" xml:space="preserve">=</text><path d="M200 243 C330 243, 330 243, 456 243" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#m-tf)"/><circle cx="328" cy="243" r="10" fill="#fff" stroke="#7c3aed"/><text x="328" y="247" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="middle" xml:space="preserve">=</text><path d="M200 277 C330 277, 330 277, 456 277" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#m-tf)"/><circle cx="328" cy="277" r="10" fill="#fff" stroke="#7c3aed"/><text x="328" y="281" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="middle" xml:space="preserve">=</text><path d="M200 311 C330 311, 330 311, 456 311" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#m-tf)"/><circle cx="328" cy="311" r="10" fill="#fff" stroke="#7c3aed"/><text x="328" y="315" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="middle" xml:space="preserve">=</text><text x="328" y="352" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle" xml:space="preserve">comparaison clé à clé,</text><text x="328" y="368" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle" xml:space="preserve">les deux curseurs avancent</text><g filter="url(#sh)"><rect x="760" y="120" width="400" height="300" rx="14" fill="#fff" stroke="#cbd5e1"/></g><text x="782" y="150" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="start" letter-spacing="1" xml:space="preserve">COMMENT ÇA MARCHE</text><text x="782" y="178" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">Merge Join lit les deux flux en parallèle,</text><text x="782" y="200" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">en une seule passe, comme une fermeture éclair.</text><text x="782" y="222" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve"></text><text x="782" y="244" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">Cela ne fonctionne que si les deux entrées</text><text x="782" y="266" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">sont triées sur la même clé : sinon SSIS</text><text x="782" y="288" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">refuse la validation (IsSorted = False).</text><text x="782" y="310" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve"></text><text x="782" y="332" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">D'où les composants Sort en amont, ou un</text><text x="782" y="354" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">ORDER BY à la source + IsSorted = True.</text><text x="40" y="420" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">Type de jointure du TP : INNER JOIN (JoinType = 2). Les deux jointures utilisent une seule colonne clé (NumKeyColumns = 1).</text><text x="40" y="444" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic" xml:space="preserve">Alternative sans tri : la transformation Lookup, qui charge la table de référence en cache.</text>
</svg>
