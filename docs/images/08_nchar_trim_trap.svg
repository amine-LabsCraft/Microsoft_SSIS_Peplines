y="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle" xml:space="preserve">·</text><rect x="880" y="140" width="28" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-opacity=".5"/><text x="894" y="166" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle" xml:space="preserve">·</text><rect x="910" y="140" width="28" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-opacity=".5"/><text x="924" y="166" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle" xml:space="preserve">·</text><path d="M40 190 v8 h358 v-8" fill="none" stroke="#2563eb" stroke-width="1.6"/><text x="219" y="216" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle" xml:space="preserve">12 caractères utiles</text><path d="M400 190 v8 h538 v-8" fill="none" stroke="#dc2626" stroke-width="1.6"/><text x="669" y="216" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc2626" text-anchor="middle" xml:space="preserve">18 espaces ajoutés automatiquement</text><text x="960" y="158" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">DATALENGTH = 60 octets</text><text x="960" y="178" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" xml:space="preserve">30 caractères × 2 (Unicode)</text><g filter="url(#sh)"><rect x="40" y="250" width="550" height="200" rx="14" fill="#fff" stroke="#dc2626" stroke-width="1.6"/></g><rect x="40" y="250" width="550" height="40" rx="14" fill="#fee2e2"/><rect x="40" y="276" width="550" height="14" fill="#fee2e2"/><text x="60" y="276" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#dc2626" text-anchor="start" letter-spacing="0.5" xml:space="preserve">✗  SANS TRIM : FAUX</text><text x="60" y="322" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">category == &quot;Informatique&quot;</text><text x="60" y="352" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">&quot;Informatique··················&quot;  ≠  &quot;Informatique&quot;</text><text x="60" y="372" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">La comparaison SSIS est exacte, espaces compris.</text><text x="60" y="430" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" xml:space="preserve">0 ligne routée : tout tombe dans la sortie par défaut</text><g filter="url(#sh)"><rect x="610" y="250" width="550" height="200" rx="14" fill="#fff" stroke="#16a34a" stroke-width="1.6"/></g><rect x="610" y="250" width="550" height="40" rx="14" fill="#dcfce7"/><rect x="610" y="276" width="550" height="14" fill="#dcfce7"/><text x="630" y="276" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#16a34a" text-anchor="start" letter-spacing="0.5" xml:space="preserve">✓  AVEC TRIM : VRAI</text><text x="630" y="322" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" xml:space="preserve">TRIM(category) == &quot;Informatique&quot;</text><text x="630" y="352" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">&quot;Informatique&quot;  ==  &quot;Informatique&quot;</text><text x="630" y="372" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">TRIM retire les espaces avant la comparaison.</text><text x="630" y="430" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" xml:space="preserve">4 lignes routées vers 03_Categorie_Informatique.txt</text><text x="40" y="488" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic" xml:space="preserve">Autres solutions : RTRIM dans la requête source (SELECT RTRIM(category) AS category …) ou une colonne NVARCHAR côté base.</text>
</svg>
